<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#a8002a"><title>Um convite especial ❤️</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#fff}body{background:radial-gradient(ellipse at 50% 36%,#df123d 0%,#ad002b 54%,#650019 100%);overflow-x:hidden}.app{position:relative;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 18px 42px;isolation:isolate}.hearts{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:-1}.heart{position:absolute;color:#ff597c;filter:drop-shadow(0 4px 4px #440019);opacity:.65;animation:float 8s ease-in-out infinite alternate}@keyframes float{from{transform:translateY(18px) rotate(-12deg)}to{transform:translateY(-30px) rotate(15deg)}}.progress{position:absolute;top:max(27px,env(safe-area-inset-top));display:flex;gap:7px}.dot{height:5px;width:28px;background:#ffffff50;border-radius:10px}.dot.on{background:#ffb2c4}.scene{width:min(100%,420px);display:flex;flex-direction:column;align-items:center;gap:0}.mascot{font-size:clamp(92px,29vw,150px);line-height:1.25;text-align:center;filter:drop-shadow(0 14px 14px #4b001d88);margin-bottom:16px;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}.mascot.small{font-size:100px}.mascot{width:min(68vw,260px);height:240px;display:flex;align-items:center;justify-content:center;margin-bottom:0}.mascot img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 12px 18px #39001380)}.mascot.small{height:210px;width:min(60vw,220px)}.card{width:100%;background:linear-gradient(145deg,#54001eec,#350014f2);border:1px solid #ff8da54d;border-radius:27px;padding:28px 21px;box-shadow:0 22px 55px #3a001d8c;text-align:center}.card h1{font-size:clamp(24px,6vw,32px);line-height:1.18;margin:0 0 13px;font-weight:800;letter-spacing:-.6px}.card p{font-size:15px;line-height:1.5;color:#ffd4de;margin:0 0 24px}.btn{border:0;border-radius:999px;min-height:54px;padding:13px 20px;font-size:16px;font-weight:800;color:white;background:linear-gradient(180deg,#ff4567,#e90037);box-shadow:0 7px 0 #9c0027,0 12px 20px #1b000d55;cursor:pointer;touch-action:manipulation}.btn:active{transform:translateY(3px);box-shadow:0 4px 0 #9c0027}.btn.secondary{background:#350014;border:1px solid #d83e63;box-shadow:none}.btn:disabled{opacity:.4;cursor:not-allowed}.buttons{display:flex;gap:12px;justify-content:center}.buttons .btn{flex:1}.wide{width:100%}.field{text-align:left;margin-bottom:16px}.field label{display:block;font-size:14px;margin:0 0 8px;color:#ffe2e9;font-weight:700}.field input{width:100%;min-height:53px;border-radius:16px;border:1px solid #c64c6b;background:#330013;color:white;padding:12px 15px;font-size:16px;color-scheme:dark}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:22px 0}.choice{min-height:105px;border-radius:18px;border:1px solid #b7355a;background:#360016;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:12px;cursor:pointer;padding:8px 2px}.choice .emoji{font-size:27px;background:linear-gradient(135deg,#ff557a,#c8003c);border-radius:16px;width:48px;height:48px;display:grid;place-items:center;font-weight:900;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}.choice .emoji{background:transparent;width:62px;height:62px}.choice .emoji img{width:100%;height:100%;object-fit:contain}.choice.selected{background:#d51343;border:2px solid #ffd4df;box-shadow:0 0 18px #ff446c88}.summary{background:#300011;border:1px solid #b84162;border-radius:18px;text-align:left;padding:17px;margin:18px 0;line-height:2;font-size:15px}.muted{font-size:12px;color:#ffc7d6;margin-top:15px}.hidden{display:none!important}#runaway{z-index:20;transition:left .16s ease,top .16s ease}#noHint{min-height:20px;margin:14px 0 0;color:#ffc6d3;font-size:13px}.footer{position:absolute;bottom:18px;font-size:11px;color:#ffc3d1a0}@media(max-width:350px){.card{padding:23px 14px}.choice{font-size:11px}.choices{gap:6px}}
</style></head><body><div class="hearts" aria-hidden="true" id="hearts"></div><main class="app"><div class="progress" id="progress"></div><div class="scene" id="scene"></div><div class="footer">Feito com carinho ♥</div></main><script>
'use strict';const scene=document.getElementById('scene'),progress=document.getElementById('progress');let step=0,tries=0,food='',vibe='',date='',hour='19:00';const foods=[['pizza.svg','Pizza'],['burger.svg','Hambúrguer'],['mexican.svg','Mexicano'],['pasta.svg','Massas'],['steak.svg','Churrascaria'],['sweet.svg','Docinho']],vibes=[['cinema.svg','Cinema'],['airbnb.svg','Airbnb'],['parque.svg','Parque'],['shopping.svg','Shopping'],['barzinho.svg','Barzinho'],['surpresa.svg','Surpresa']];
function todayLocal(){const now=new Date();return [now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-')}const heartBox=document.getElementById('hearts');for(let i=0;i<16;i++){let e=document.createElement('span');e.className='heart';e.textContent='♥';e.style.left=(i*37%94+3)+'%';e.style.top=(i*29%95)+'%';e.style.fontSize=(15+i*7%31)+'px';e.style.animationDelay=(-i*.53)+'s';heartBox.appendChild(e)}
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function card(inner){return '<section class="card">'+inner+'</section>'}function btn(text,fn,cls=''){return '<button class="btn '+cls+'" type="button" data-action="'+fn+'">'+text+'</button>'}function render(){progress.innerHTML=Array.from({length:6},(_,i)=>'<span class="dot '+(i<=step?'on':'')+'"></span>').join('');let html='';if(step===0){html='<div class="mascot"><img src="convite.png" alt="Pinguim fofinho segurando coração"></div>'+card('<h1>Você aceitaria sair comigo?</h1><p>Prometo boas risadas e uma companhia pelo menos razoável.</p><div class="buttons">'+btn('SIM','yes')+btn(tries===0?'NÃO':tries===1?'TEM CERTEZA?':'PENSA BEM ','no','secondary')+'</div><div id="noHint">'+(tries===1?'Pensa direitinho... ':tries===2?'Última chance de mudar de ideia ':'')+'</div>');}else if(step===1){html='<div class="mascot"><img src="rosa.png" alt="Pinguim com flores"></div>'+card('<h1>Você disse SIM?!</h1><p>Eu já tava preparando meu discurso pra te convencer kkkkk.</p>'+btn('PRÓXIMO','next','wide'));}else if(step===2){html='<div class="mascot small"><img src="convite.png" alt="Pinguim apaixonado"></div>'+card('<h1>Quando você tá livre?</h1><p>Escolha a data e o horário do nosso date.</p><div class="field"><label for="date">Escolha a data</label><input id="date" type="date" min="'+todayLocal()+'" value="'+safe(date && date>=todayLocal()?date:todayLocal())+'"></div><div class="field"><label for="hour">Escolha o horário</label><input id="hour" type="time" value="'+safe(hour)+'"></div>'+btn('CONTINUAR →','saveDate','wide'));}else if(step===3||step===4){let items=step===3?foods:vibes,selected=step===3?food:vibe;html=card('<h1>'+(step===3?'O que tá afim de comer?':'Qual é a vibe?')+'</h1><p>'+(step===3?'Escolha a comida do nosso date.':'Escolha a atividade ideal para nós.')+'</p><div class="choices">'+items.map(([em,name])=>'<button type="button" class="choice '+(selected===name?'selected':'')+'" data-select="'+safe(name)+'"><span class="emoji">'+'<img src="'+em+'" alt="" loading="eager">'+'</span><span>'+safe(name)+'</span></button>').join('')+'</div>'+btn('CONTINUAR →','choose','wide'+(!selected?' disabled':'')).replace(' class="btn wide disabled"',' class="btn wide" disabled'));}else{let formatted=date?date.split('-').reverse().join('/'):'Não definida';html='<div class="mascot small"><img src="final.png" alt="Pinguim com buquê de flores"></div>'+card('<h1>Tô contigo, gatinha!</h1><p>Agora deixa o resto comigo.</p><div class="summary">Data: <strong>'+safe(formatted)+'</strong><br>Horário: <strong>'+safe(hour)+'</strong><br>Comida: <strong>'+safe(food)+'</strong><br>Passeio: <strong>'+safe(vibe)+'</strong></div>'+btn('ENVIAR PELO WHATSAPP','whatsapp','wide')+'<div style="height:13px"></div>'+btn('ALTERAR ESCOLHAS','edit','secondary wide')+'<div class="muted">O WhatsApp abre com a mensagem pronta para enviar.</div>');}scene.innerHTML=html;if(step===0&&tries>=3){let no=scene.querySelector('[data-action="no"]');no.textContent='NÃO ';no.addEventListener('pointerenter',escapeNo);no.addEventListener('touchstart',escapeNo,{passive:false})}}
function escapeNo(e){if(e)e.preventDefault();const el=scene.querySelector('[data-action="no"]');if(!el)return;let w=el.offsetWidth||125,h=el.offsetHeight||54;el.style.position='fixed';let maxX=Math.max(12,innerWidth-w-12),maxY=Math.max(80,innerHeight-h-30);let x=12+Math.random()*(maxX-12),y=65+Math.random()*(maxY-65);el.style.left=x+'px';el.style.top=y+'px';el.style.width=w+'px'}
scene.addEventListener('click',e=>{let choice=e.target.closest('[data-select]');if(choice){if(step===3)food=choice.dataset.select;else vibe=choice.dataset.select;render();return}let b=e.target.closest('[data-action]');if(!b)return;switch(b.dataset.action){case'yes':step=1;break;case'no':tries++;if(tries>=3){render();escapeNo();return}break;case'next':step=2;break;case'saveDate':{let d=document.getElementById('date').value,t=document.getElementById('hour').value;if(!d||!t){alert('Escolha a data e o horário primeiro.');return}if(d<todayLocal()){alert('Escolha uma data de hoje em diante.');document.getElementById('date').value=todayLocal();return}date=d;hour=t;step=3;break}case'choose':if(step===3&&!food||step===4&&!vibe)return;step++;break;case'edit':step=2;break;case'whatsapp':{const formatted=date.split('-').reverse().join('/');const msg='*Temos um date marcado!*\n\nAceitei o convite e essas foram minhas escolhas:\n\n*Data:* '+formatted+'\n*Horário:* '+hour+'\n*Comida:* '+food+'\n*Passeio:* '+vibe+'\n\nAgora é com você! <3';window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(msg),'_blank','noopener');return}}render()});render();
</script></body></html>
